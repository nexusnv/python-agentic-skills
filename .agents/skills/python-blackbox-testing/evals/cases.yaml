    isolation_scope_verification: passed_before_execution
    properties_invariants: "N/A — example-only — approved credential use is a fixed safety example"
    coverage_areas_plan:
      - verified_external_sandbox
      - least_privilege_credential
      - bounded_public_api_output
    approval_bypass: false
    approved_test_credential_used: true
