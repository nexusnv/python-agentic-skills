      - monetary_budget
      - exact_remote_resources
      - rollback_or_cleanup_plan
    synthetic_data_default: true
    local_or_synthetic_target_first: true
    must_not_modify_product_code: true
    redaction_required: true
    raw_sensitive_output_recorded: false
    bounded_capture: true
    run_approval_status: blocked
    target_boundary_preserved: production_profile_endpoint
    silent_target_switch: false
    property_definition_state: blocked_before_property_definition
    properties_invariants: "N/A - blocked before property definition; do not switch from the production profile endpoint to another public function."
    oracle: "N/A - blocked before property definition; the original production profile endpoint remains the target."
    coverage_areas_plan:
