- id: hypothesis-absent-native-fallback
  prompt: >-
    This Python project uses unittest and has no Hypothesis dependency. Do not
    add packages. Add a property for trim_and_normalize(text), which must remove
    leading and trailing whitespace and collapse internal Unicode whitespace
    runs to one ASCII space. Use fixed cases and 250 seeded generated Unicode
    strings, disclose any reduced guarantee, and make the result replayable.
  kind: positive
  expected:
    activates: true
    property_before_generation: true
    fixed_examples_required: true
    generated_examples_not_proof: true
    valid_invalid_unsupported_separated: true
    oracle_required: true
    deterministic_seed: true
    seed: "8675309"
    replay_command_required: true
    unicode_replay_evidence_required: true
    unicode_version_or_fixed_whitespace_set: true
    hypothesis_optional: true
    dependency_install_attempt: false
    fallback_strategy: project_native_deterministic_table_and_seeded_generator
    fallback_disclosure_required: true
    automatic_shrinking_available: false
    no_shrinking: true
    no_early_return: true
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    must_report_coverage_gaps: true
    runner: unittest
    valid_domain: "All finite strings of Unicode scalar values"
    property_statement: "For every valid text, trim_and_normalize(text) equals text stripped at both ends with each internal Unicode whitespace run replaced by one ASCII space."
    properties_invariants: "For every valid text, trim_and_normalize(text) equals text stripped at both ends with each internal Unicode whitespace run replaced by one ASCII space."
    oracle: "Exact equality with the independently stated whitespace transformation"
    fixed_examples:
      - empty_string
      - surrounding_whitespace
      - repeated_internal_whitespace
      - unicode_whitespace
      - non_breaking_space
    coverage_areas_plan:
