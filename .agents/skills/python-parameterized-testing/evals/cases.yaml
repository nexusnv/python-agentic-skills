# skill: python-parameterized-testing
# version: 1
- id: public-unicode-round-trip-property
  prompt: >-
    Test the public Python API encode_text(text) and decode_text(payload) in a
    package that encodes Unicode scalar sequences as UTF-8. Before generating
    data, define the valid domain, a clear round-trip property, and an oracle.
    Keep fixed examples for the empty string, ASCII, a newline, accented text,
    decomposed Unicode, and emoji. Add bounded generated witnesses with an
    explicit seed, retain them as witnesses rather than proof, and provide an
    exact replay command.
  kind: positive
  expected:
    activates: true
    property_before_generation: true
    fixed_examples_required: true
    generated_examples_not_proof: true
    valid_invalid_unsupported_separated: true
    oracle_required: true
    deterministic_seed: true
    seed: "20260924"
    replay_command_required: true
    unicode_replay_evidence_required: true
    unicode_version_or_fixed_whitespace_set: true
    hypothesis_optional: true
    no_early_return: true
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    must_report_coverage_gaps: true
    valid_domain: "All finite sequences of Unicode scalar values"
    property_statement: "For every finite sequence s of Unicode scalar values, decode_text(encode_text(s)) == s."
    properties_invariants: "For every finite sequence s of Unicode scalar values, decode_text(encode_text(s)) == s."
    oracle: "The decoded value equals the original Unicode string exactly"
    fixed_examples:
      - empty_string
      - ascii
      - newline
      - accented_text
      - decomposed_unicode
      - emoji
    coverage_areas_plan:
      - valid_unicode_domain
      - fixed_examples
      - bounded_generated_witnesses
      - seed_replay
      - invalid_payloads
      - unsupported_non_utf8_bytes

- id: collection-transformation-invariant-matrix
  prompt: >-
    Build a table-driven and generated invariant matrix for the public
    index_users(users) function. Its valid domain is a finite collection of
    unique user IDs from 0 through 1000 with non-empty Unicode names. Include
    an empty collection, singleton, minimum and maximum IDs, combining marks,
    emoji, and dependent values where a name contains its own ID. State and
    check a quantified preservation invariant with a fixed seed and a replay
    command.
  kind: positive
  expected:
    activates: true
    property_before_generation: true
    fixed_examples_required: true
    dependent_values_required: true
    generated_examples_not_proof: true
    valid_invalid_unsupported_separated: true
    oracle_required: true
    deterministic_seed: true
    seed: "20260925"
    replay_command_required: true
    hypothesis_optional: true
    no_early_return: true
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    must_report_coverage_gaps: true
    valid_domain: "Finite collections of unique IDs in 0..1000 paired with non-empty Unicode names"
    property_statement: "For every valid users collection, index_users(users) contains exactly one entry per user and each ID maps to that user's exact name."
    properties_invariants: "For every valid users collection, index_users(users) contains exactly one entry per user and each ID maps to that user's exact name."
    oracle: "The returned ID-to-name mapping is the exact pair-preserving bijection for the input collection"
    fixed_examples:
      - empty_collection
      - singleton
      - minimum_id
      - maximum_id
      - combining_marks
      - emoji
      - id_dependent_name
    coverage_areas_plan:
      - empty_and_singleton
      - numeric_boundaries
      - unicode_names
      - dependent_values
      - generated_collections
      - invalid_duplicates

- id: differential-metamorphic-money-oracles
  prompt: >-
    Test the public render_cents(cents, currency) and parse_cents(text, currency)
    API for integer values from 0 through 1000000000000 and the project's
    supported currencies. Compare rendering with an independently implemented
    Decimal-based reference, and also use the meaningful metamorphic oracle that
    parsing the rendered value recovers the original integer. Include fixed
    zero, small, boundary, and currency examples plus seeded generated
    witnesses. State the property first and do not present the samples as
    proof.
  kind: positive
  expected:
    activates: true
    property_before_generation: true
    fixed_examples_required: true
    generated_examples_not_proof: true
    valid_invalid_unsupported_separated: true
    oracle_required: true
    independent_reference_required: true
    independent_oracle_required: true
    metamorphic_oracle_required: true
    deterministic_seed: true
    seed: "424242"
    replay_command_required: true
    hypothesis_optional: true
    no_early_return: true
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    must_report_coverage_gaps: true
    valid_domain: "Integers in 0..1000000000000 paired with supported currencies"
    property_statement: "For every valid cents and currency, parse_cents(render_cents(cents, currency), currency) == cents and rendering agrees with the independent Decimal reference."
    properties_invariants: "For every valid cents and currency, parse_cents(render_cents(cents, currency), currency) == cents and rendering agrees with the independent Decimal reference."
    oracle: "Differential agreement with a separate Decimal model plus exact integer round-trip recovery"
    fixed_examples:
      - zero
      - smallest_positive
      - currency_minor_unit_boundaries
      - maximum_integer
      - every_supported_currency
    coverage_areas_plan:
      - differential_reference
      - metamorphic_round_trip
      - currency_boundaries
      - fixed_examples
      - bounded_generated_witnesses
      - invalid_and_unsupported_currency

