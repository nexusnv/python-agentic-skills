    invalid task IDs, empty labels, malformed Unicode, and out-of-range values.
    For every invalid case, assert the documented exception and compare the
    complete store snapshot before and after the call. Do not return before
    asserting the rejection or its side-effect result.
  kind: positive
  expected:
    activates: true
    property_before_generation: true
    fixed_examples_required: true
    generated_examples_not_proof: true
    valid_invalid_unsupported_separated: true
    oracle_required: true
    no_early_return: true
    invalid_rejection_asserted: true
    side_effect_asserted: true
    deterministic_seed: true
