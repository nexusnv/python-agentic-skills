    must_report_coverage_gaps: true
    valid_domain: "Task IDs in 1..1000 paired with non-empty well-formed Unicode labels"
    property_statement: "For every invalid task, add_task raises the documented validation exception and leaves the complete store equal to its pre-call snapshot."
    properties_invariants: "For every invalid task, add_task raises the documented validation exception and leaves the complete store equal to its pre-call snapshot."
    oracle: "The exact documented exception plus deep equality of the complete before-and-after store snapshots"
    fixed_examples:
      - zero_id
      - negative_id
      - maximum_plus_one_id
      - empty_label
      - malformed_unicode
    coverage_areas_plan:
      - invalid_id
