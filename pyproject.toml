[project]
name = "python-agentic-skills"
version = "0.0.0"
requires-python = ">=3.10"

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pyyaml>=6.0,<7",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/superpowers/plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
