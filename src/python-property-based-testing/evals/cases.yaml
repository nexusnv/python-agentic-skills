# skill: python-property-based-testing
# version: 1
- id: property-unicode-round-trip-hypothesis
  prompt: >-
    Test the public Python API encode_text(text) and decode_text(payload) with
    a quantified round-trip property using Hypothesis strategies. Before
    generating data, state the property, the valid domain, and an independent
    oracle. Keep fixed examples for the empty string, ASCII, a newline,
    accented text, decomposed Unicode, and emoji. Add bounded Hypothesis
    witnesses with st.text over Unicode scalar values, an explicit seed and
    settings, shrinking on failure, and an exact replay command.
  kind: positive
  expected:
    activates: true
    framework_native: true
    property_before_generation: true
    fixed_examples_required: true
    generated_examples_not_proof: true
    valid_invalid_unsupported_separated: true
    oracle_required: true
    independent_oracle_required: true
    deterministic_seed: true
    seed: "20261009"
    replay_command_required: true
    unicode_replay_evidence_required: true
    unicode_version_or_fixed_whitespace_set: true
    hypothesis_optional: true
    hypothesis_settings_recorded: true
    shrinking_available: true
    minimization_required: true
    no_early_return: true
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    must_report_coverage_gaps: true
    valid_domain: "All finite sequences of Unicode scalar values"
    property_statement: "For every finite sequence s of Unicode scalar values, decode_text(encode_text(s)) == s."
    properties_invariants: "For every finite sequence s of Unicode scalar values, decode_text(encode_text(s)) == s."
    oracle: "The decoded value equals the original Unicode string exactly"
    strategy_sketches: "st.text over Unicode scalar values composed around fixed boundary examples"
    fixed_examples:
      - empty_string
      - ascii
      - newline
      - accented_text
      - decomposed_unicode
      - emoji
    coverage_areas_plan:
      - valid_unicode_domain
      - fixed_examples
      - hypothesis_strategies
      - shrinking
      - seed_replay
      - invalid_payloads

- id: property-differential-money-oracles
  prompt: >-
    Test the public render_cents(cents, currency) and parse_cents(text,
    currency) API with a quantified differential and metamorphic property using
    Hypothesis. Compare rendering with an independently implemented
    Decimal-based reference anchored by hand-verified golden cases, and check
    the metamorphic oracle that parsing the rendered value recovers the
    original integer. Include fixed zero, small, boundary, and currency
    examples plus seeded Hypothesis witnesses with shrinking. State the
    property first and do not present the samples as proof.
  kind: positive
  expected:
    activates: true
    framework_native: true
    property_before_generation: true
    fixed_examples_required: true
    generated_examples_not_proof: true
    valid_invalid_unsupported_separated: true
    oracle_required: true
    independent_reference_required: true
    independent_oracle_required: true
    metamorphic_oracle_required: true
    hand_verified_golden_required: true
    recurrence_detected: false
    oracle_independent: true
    deterministic_seed: true
    seed: "424242"
    replay_command_required: true
    hypothesis_optional: true
    hypothesis_settings_recorded: true
    shrinking_available: true
    minimization_required: true
    no_early_return: true
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    must_report_coverage_gaps: true
    valid_domain: "Integers in 0..1000000000000 paired with supported currencies"
    property_statement: "For every valid cents and currency, parse_cents(render_cents(cents, currency), currency) == cents and rendering agrees with the independent Decimal reference."
    properties_invariants: "For every valid cents and currency, parse_cents(render_cents(cents, currency), currency) == cents and rendering agrees with the independent Decimal reference."
    oracle: "Differential agreement with a separate Decimal model plus exact integer round-trip recovery"
    strategy_sketches: "st.integers in range composed with st.sampled_from of supported currencies"
    fixed_examples:
      - zero
      - smallest_positive
      - currency_minor_unit_boundaries
      - maximum_integer
      - every_supported_currency
    coverage_areas_plan:
      - differential_reference
      - hand_verified_goldens
      - metamorphic_round_trip
      - currency_boundaries
      - hypothesis_strategies
      - shrinking

- id: property-assume-budget-and-shrink
  prompt: >-
    Test the public normalize_handle(handle) function with a quantified
    Hypothesis property over non-empty Unicode handles of 1 to 64 characters.
    Bound assume filtering with an explicit budget, record the assume-filtered
    count with its coverage impact, replay the exact seed on failure, shrink
    the counterexample, and retain the minimized input as a fixed regression
    plus the broader property.
  kind: positive
  expected:
    activates: true
    framework_native: true
    property_before_generation: true
    fixed_examples_required: true
    generated_examples_not_proof: true
    valid_invalid_unsupported_separated: true
    oracle_required: true
    deterministic_seed: true
    seed: "777001"
    replay_command_required: true
    exact_seed_replay_required: true
    hypothesis_optional: true
    hypothesis_settings_recorded: true
    shrinking_available: true
    minimization_required: true
    minimized_regression_retained: true
    assume_budget_required: true
    assume_filtered_count_reported: true
    reported_assume_filtered_count: "6"
    discarded_count_reported: true
    reported_discarded_count: "3"
    no_early_return: true
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    must_report_coverage_gaps: true
    valid_domain: "Non-empty Unicode handles of 1 to 64 characters"
    property_statement: "For every valid handle, normalize_handle(handle) returns the documented canonical form without mutating the input."
    properties_invariants: "For every valid handle, normalize_handle(handle) returns the documented canonical form without mutating the input."
    oracle: "Exact equality with the documented canonical handle form"
    strategy_sketches: "st.text with bounded length filtered by an explicit assume precondition and budget"
    fixed_examples:
      - minimum_handle
      - maximum_handle
      - unicode_handle
    coverage_areas_plan:
      - assume_budget
      - assume_filtered_families
      - shrinking
      - exact_seed_replay
      - retained_regression

