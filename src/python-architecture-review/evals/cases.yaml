- id: arch-complete-proposal-evidence
  prompt: >-
    Produce the proposal report for an architecture review that used the
    project-native runner with seed 20261009. Include the review profile,
    seam dimensions, complexity gate, forward-looking sources, findings with
    severities, locations, evidence, remediations, confirmed statuses, every
    exact command and process exit status, skipped and not-run work, and all
    limitations. State that static findings are advisory until confirmed.
  kind: evidence
  expected:
    activates: true
    framework_native: true
    read_only_review: true
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    real_secret_access: false
    real_credential_use: false
    real_production_data_access: false
    customer_data_access: false
    exact_command_required: true
    exit_status_required: true
    must_report_not_run: true
    must_report_coverage_gaps: true
    limitations_required: true
    static_advisory_boundary: true
    seed: "20261009"
    required_report_fields:
      - review_profile
      - seam_dimensions
      - complexity_gate
      - forward_looking_sources
      - properties_invariants
      - coverage_areas_plan
      - finding_severity
      - dimension
      - finding_location
      - finding_evidence
      - proposed_remediation
      - confirmed_status
      - seed
      - runner
      - environment
      - exact_commands
      - process_exit_statuses
      - pass_fail_skip_expected_failure_and_not_run_results
      - coverage_gaps
      - limitations
      - static_advisory_boundary
    properties_invariants: "Each finding maps to a seam dimension with a severity that is advisory until confirmed by reading code."
    coverage_areas_plan:
      - review_profile
      - finding_severities
      - exact_commands_and_exit_status
      - skipped_and_not_run
      - limitations
      - advisory_boundary
