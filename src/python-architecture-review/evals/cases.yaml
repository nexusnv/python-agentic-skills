# skill: python-architecture-review
# version: 1
- id: arch-layered-service-creep-proposal
  prompt: >-
    Review a Python Flask service where the allocate endpoint grew
    is_valid_sku checks, try/except OutOfStock, and session.commit() in the
    controller. Map the seams, apply the complexity gate, propose a Cosmic
    Python target with service layer and unit of work, and specify guards
    that make the new layering hard to violate. Stay read-only and respond
    in chat.
  kind: positive
  expected:
    activates: true
    framework_native: true
    read_only_review: true
    gate_decision: part-1-service-layer
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    real_secret_access: false
    real_credential_use: false
    real_production_data_access: false
    customer_data_access: false
    properties_invariants: "Service orchestration lives behind ports with the unit of work owning atomicity; controllers stay thin."
    coverage_areas_plan:
      - seam_map
      - complexity_gate
      - target_proposal
      - enforcement_guards
- id: arch-crud-carve-out-respected
  prompt: >-
    Review a simple Python CRUD application with single-table reads and
    writes and no orchestration creep or cross-entity invariants. Confirm
    whether Cosmic Python aggregates, bus, or CQRS are justified, and record
    the carve-out decision with reasons and guards for the simple shape.
  kind: positive
  expected:
    activates: true
    framework_native: true
    read_only_review: true
    gate_decision: crud-carve-out
    part2_prescribed: false
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    real_secret_access: false
    real_credential_use: false
    real_production_data_access: false
    customer_data_access: false
    properties_invariants: "Simple CRUD targets keep framework-native layering; aggregates and bus are not justified without trigger evidence."
    coverage_areas_plan:
      - seam_map
      - complexity_gate
      - carve_out_rationale
- id: arch-forward-looking-event-chain
  prompt: >-
    Review a single-aggregate Python service today whose roadmap milestone
    M2 plans a multi-service event chain. Propose what ships now versus
    what stays future-ready, label each item current or anticipated with
    its trigger, and defer the outbox and bus wiring until M2.
  kind: positive
  expected:
    activates: true
    framework_native: true
    read_only_review: true
    anticipated_trigger_recorded: true
    part2_deferred_until_trigger: true
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    real_secret_access: false
    real_credential_use: false
    real_production_data_access: false
    customer_data_access: false
    properties_invariants: "Each recommendation is labeled current or anticipated with the milestone trigger that justifies it."
    coverage_areas_plan:
      - forward_looking_sources
      - complexity_gate
      - phased_proposal
