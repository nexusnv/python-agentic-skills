- id: audit-complete-scorecard-evidence
  prompt: >-
    Produce the scorecard for a quick audit that used the project-native runner
    with seed 20260929. Include the audit profile, dimensions, severities,
    locations, evidence, proposed remediations, confirmed statuses, every exact
    command and process exit status, skipped and not-run work, and all
    limitations. State that static findings are advisory until confirmed.
  kind: evidence
  expected:
    activates: true
    framework_native: true
    read_only_audit: true
    quick_profile_default: true
    static_advisory_until_confirmed: true
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    real_secret_access: false
    real_credential_use: false
    real_production_data_access: false
    customer_data_access: false
    exact_command_required: true
    exit_status_required: true
    must_report_not_run: true
    must_report_coverage_gaps: true
    limitations_required: true
    seed: "20260929"
    required_report_fields:
      - audit_profile
      - properties_invariants
      - coverage_areas_plan
      - finding_severity
      - dimension
      - finding_location
      - finding_evidence
      - proposed_remediation
      - confirmed_status
      - seed
      - runner
      - environment
      - exact_commands
      - process_exit_statuses
      - pass_fail_skip_expected_failure_and_not_run_results
      - coverage_gaps
      - limitations
      - static_advisory_boundary
    properties_invariants: "Each scorecard row names a dimension and severity with confirmation status and static patterns labeled advisory."
    coverage_areas_plan:
      - audit_profile
      - finding_severities
      - exact_commands_and_exit_status
      - skipped_and_not_run
      - limitations
      - advisory_boundary
