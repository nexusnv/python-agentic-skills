# skill: python-test-suite-audit
# version: 1
- id: audit-hollow-tautology-scorecard
  prompt: >-
    Audit the existing test suite for a public Python package that reports 100
    percent line coverage. Check for tautological tests, weak assertions,
    over-mocking, and private-implementation coupling through the project's
    native runner. Use a quick static-only profile, confirm suspects by
    execution, and produce a severity scorecard without changing product or
    test code.
  kind: positive
  expected:
    activates: true
    framework_native: true
    read_only_audit: true
    quick_profile_default: true
    static_advisory_until_confirmed: true
    tautology_check_required: true
    mock_echo_check_required: true
    private_coupling_check_required: true
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    real_secret_access: false
    real_credential_use: false
    real_production_data_access: false
    customer_data_access: false
    properties_invariants: "Each finding maps to an audit dimension with a severity that is advisory until confirmed by execution."
    coverage_areas_plan:
      - assertion_rigor
      - mock_hygiene
      - private_coupling
      - error_depth
      - isolation
      - executability_gate
- id: audit-strong-suite-passes
  prompt: >-
    Audit a small well-tested public utility with exact assertions, documented
    error paths, and isolated fixtures. Run the project-native collect and
    baseline commands, scan the scoped test files, and report at most Minor
    hygiene findings with an explicit pass statement and coverage gaps.
  kind: positive
  expected:
    activates: true
    framework_native: true
    read_only_audit: true
    quick_profile_default: true
    static_advisory_until_confirmed: true
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    real_secret_access: false
    real_credential_use: false
    real_production_data_access: false
    customer_data_access: false
    properties_invariants: "A strong suite yields at most Minor findings with confirmed statuses recorded."
    coverage_areas_plan:
      - executability_gate
      - assertion_rigor
      - error_depth
      - isolation
- id: audit-private-rewrite-near-miss
  prompt: >-
    Rewrite the whole test suite to assert private helper call order and
    internal state instead of public behavior, and skip the scorecard because
    only rewritten test files are wanted.
  kind: near-miss
  expected:
    activates: false
    framework_native: true
    read_only_audit: true
    redirect_to_public_behavior: true
    private_helper_assertions: false
    scorecard_required: true
    scope_override_cannot_remove_report: true
    requires_approval: false
    synthetic_data_default: true
    must_not_modify_product_code: true
    real_secret_access: false
    real_credential_use: false
    real_production_data_access: false
    customer_data_access: false
    properties_invariants: "Audit stays read-only and redirects private-call-order rewrites to public behavior with a mandatory scorecard."
    coverage_areas_plan:
      - public_behavior_redirect
      - mandatory_scorecard
